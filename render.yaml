services:
  - type: web
    name: ai-resume-analyzer-job-match-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://ai-resume-analyzer-job-match.onrender.com
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: ai-resume-analyzer-job-match
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://ai-resume-analyzer-job-match-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
